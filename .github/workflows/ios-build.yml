name: Build XITFORGE IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build archive
        run: |
          xcodebuild             -project ios/XITFORGE.xcodeproj             -scheme XITFORGE             -configuration Release             -sdk iphoneos             -archivePath $RUNNER_TEMP/XITFORGE.xcarchive             archive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/XITFORGE.xcarchive/Products/Applications/XITFORGE.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r XITFORGE-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XITFORGE-unsigned-IPA
          path: ${{ runner.temp }}/XITFORGE-unsigned.ipa
